name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build MSI (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p composeApp/src/jvmMain/resources
          cat <<EOF > composeApp/src/jvmMain/resources/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Build MSI Installer
        run: ./gradlew :composeApp:packageMsi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: ScannerKKP-Windows-Installer
          path: composeApp/build/compose/binaries/main/msi/*.msi
